name: Escáner squeeze semanal Bitget

on:
  workflow_dispatch:
  push:
    branches:
      - claude/bitget-bollinger-macd-analysis-hjze2u
    paths:
      - analisis-crypto/bitget_squeeze_scanner.py
      - .github/workflows/bitget-squeeze.yml

permissions:
  contents: write

concurrency:
  group: bitget-squeeze
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar escáner
        working-directory: analisis-crypto
        run: python3 bitget_squeeze_scanner.py --min-vol 1e6 --top 80 --out resultados.json

      - name: Guardar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analisis-crypto/resultados.json
          git diff --cached --quiet || git commit -m "Resultados del escáner squeeze semanal Bitget"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: analisis-crypto/resultados.json
          if-no-files-found: ignore
